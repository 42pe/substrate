name: Publish

# Publishes to npm when a release tag `vX.Y.Z` is pushed. This is an
# OPERATOR-triggered workflow: it requires the `NPM_TOKEN` repository secret
# (an npm automation token) to be configured. Provenance (`--provenance`) is
# intentionally NOT used in v0.1.0 — the pinned pnpm 7 predates that flag; it
# is deferred to a future release on a newer pnpm.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Writes an .npmrc that authenticates via NODE_AUTH_TOKEN; pnpm reads it.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui install --frozen-lockfile

      # dist/ is gitignored — build BEFORE publish so the tarball has content.
      - run: pnpm build

      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
