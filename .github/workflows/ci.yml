name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't affect build/test — skip the matrix to save CI minutes.
    paths-ignore: ['**.md', '.agents/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '.agents/**', 'LICENSE']

# Cancel superseded runs on the same ref (e.g. rapid re-pushes to a PR branch) so
# only the latest commit consumes the matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is best-effort: the leg RUNS (so platform problems stay visible)
    # but a failure does not block the workflow.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version is resolved from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The UI is a separate package (its own lockfile), not a workspace member,
      # so it needs its own install in addition to the root install.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui install --frozen-lockfile

      # --- Cross-platform checks (run on all three OSes) ---
      - run: pnpm build # server (tsc) + ui (vite)
      - run: pnpm exec tsc --noEmit # root typecheck (distinct from the build tsconfig)
      - run: pnpm --dir ui exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm --dir ui lint
      - run: pnpm format:check
      - run: pnpm test # server unit + integration
      - run: pnpm --dir ui test # ui jsdom: sanitizer + components
      - run: pnpm test:smoke:concurrency

      # --- macOS-only: the Playwright UI smoke (installs a browser) ---
      - if: matrix.os == 'macos-latest'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.os == 'macos-latest'
        run: pnpm test:smoke:ui
